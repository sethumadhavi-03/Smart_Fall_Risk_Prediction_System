<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#1e1e2f,#2c3e50);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background: rgba(255,255,255,0.08);
    padding:35px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    width:320px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
    outline:none;
}

button{
    width:100%;
    padding:10px;
    background:#00ff9f;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
}

button:hover{
    background:#00cc7a;
}

.link-btn{
    background:transparent;
    border:1px solid #00ff9f;
    color:#00ff9f;
}

.link-btn:hover{
    background:#00ff9f;
    color:black;
}

p{
    margin-top:15px;
    font-size:13px;
    color:#ccc;
}
</style>

</head>

<body>

<div class="box">

<h2>🔐 Login</h2>

<form method="POST" action="/login">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>
</form>

<p>New user?</p>

<button class="link-btn" onclick="window.location.href='/register_page'">
    📝 Create Account
</button>

<button class="link-btn" onclick="window.location.href='/'">
    ⬅ Back
</button>

</div>

</body>
</html>
