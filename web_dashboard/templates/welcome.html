<!DOCTYPE html>
<html>
<head>
<title>Welcome</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#1e1e2f,#2c3e50);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background: rgba(255,255,255,0.08);
    padding:40px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    width:350px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#00ff9f;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

button:hover{
    background:#00cc7a;
}
</style>

</head>

<body>

<div class="box">

<h1>🧠 Smart Fall Detection</h1>
<p>Real-Time Monitoring System</p>

<button onclick="window.location.href='/login_page'">🔐 Login</button>
<button onclick="window.location.href='/register_page'">📝 Register</button>

</div>

</body>
</html>
